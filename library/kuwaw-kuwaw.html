odriguez\nGuhit ni Raymond L. Idaño", "e": "Kuwaw… Kuwaw… The Cry It Always Makes! Story by Jesila C. Saboureault. Translated into Filipino by Venice D. Rodriguez. Illustrations by Raymond L. Idaño.", "x": [["Cuyunen", "(Kuwaw…Kuwaw… Anang Pirmeng Ugyaw!)"]]}, {"i": 1, "h": "", "f": "Noong unang panahon, nabulabog ang masaya at mapayapang kaharian ng mahal na hari.", "e": "Once upon a time, the happy and peaceful kingdom of the beloved king was stirred up.", "x": [["Cuyunen", "Ang unang timpo, nabulabog ang masadya ig maambeng nga kaadyan ni Senior Adi."]]}, {"i": 2, "h": "", "f": "“Mahal na hari!” pagod na humahangos si Kilyawan.", "e": "“Your Majesty!” cried Kilyawan the oriole, tired and out of breath.", "x": [["Cuyunen", "“Senior Adi! Senior Adi!” bedlay na ing aapuwan pang ugyaw ni Tutulyaw."]]}, {"i": 3, "h": "", "f": "“May apoy na dala si Alitaptap!”", "e": "“Firefly is carrying fire!”", "x": [["Cuyunen", "“Si Kito-kiton aga dara y kalayo!”"]]}, {"i": 4, "h": "", "f": "Unang mga pahina lamang ang mababasa rito.", "e": "Only the first pages can be read here.", "x": []}]}], "lib": "index.html", "preview": "KORTEX: the first pages only, online (R189)"}</script>
