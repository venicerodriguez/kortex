 by Michelle C. Caabay into Cuyunen, Jomar C. Amit into Tagbanua, and Feberlyn I. Sarmiento into Calamianen. Illustrations by Randy P. Valiente.", "x": []}, {"i": 1, "h": "", "f": "Napabalikwas ako sa pag-aakalang kanina pa tumunog ang orasan.", "e": "When I heard the clock chiming, I was hurried.", "x": [["Cuyunen", "Apabaliskad ako kaisip ko kayna pa aga tunog ang orasan."], ["Tagbanua", "Arii! Naklagaw, kagisipu nagtunul da yang rilu."], ["Calamianen", "Nabungkaras aw tung kabantawung nungayna pa tumunul ang orasan."]]}, {"i": 2, "h": "", "f": "“Magandang umaga, Ate naming maganda,” nakasanayang wika ni Nanay Ines.", "e": "The words “Good morning to our most beautiful,” were spoken by Mom.", "x": [["Cuyunen", "Mayad nga timprano ameng manang na pustura, akasanayang limeg ni Nanay Ines."], ["Tagbanua", "‘Mupyang timpranu, pusturang manang u’, yara tiya yang naanaran ang sambitën ni Nanay Ines."], ["Calamianen", "“Mupyang timpranu, Manang yameng pustura,” ang perming aning ni Nanay Ines."]]}, {"i": 3, "h": "", "f": "Pangiti akong tumugon habang nanlalabo ang paningin.", "e": "My eyes were still hazy, but I grinned.", "x": [["Cuyunen", "Akangirit akong ag sabat maski agapayengpeng pa akeng paneleng."], ["Tagbanua", "Paisëmaw ang nagtuwal tung anya, ang yang mata u panlaώuk pa."], ["Calamianen", "Paimuda’w ang nag een mentras panlawuk ang paneleng o."]]}, {"i": 4, "h": "", "f": "Unang mga pahina lamang ang mababasa rito.", "e": "Only the first pages can be read here.", "x": []}]}], "lib": "index.html", "preview": "KORTEX: the first pages only, online (R189)"}</script>
