.lock i{font-style:italic;font-weight:600;color:var(--soft)}.cite{color:var(--soft);font-size:.86rem;margin:.8em 0 0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px}.gw,.gr{display:inline-flex;flex-direction:column;align-items:flex-start;padding:14px 22px;border-radius:16px;font-weight:800;font-size:1.15rem;box-shadow:0 8px 24px #1f2a5a26}
.gw{background:var(--blue);color:#fff}.gr{background:#fff;color:var(--blue)}.gw i,.gr i{font-weight:600;font-size:.8rem;font-style:italic;opacity:.9}
.ed{background:none;color:var(--soft);font-weight:700;text-decoration:underline;margin-top:10px;font-size:.88rem}
.rd{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 10px calc(16px + env(safe-area-inset-bottom,0px))}
.pgw{position:relative;max-width:min(96vw,calc((100vh - 170px) * .707));width:100%;touch-action:pan-y}.pgw img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 0 0 3px #fff,0 16px 40px #1f2a5a33;background:#fff}
.rb{display:flex;align-items:center;gap:10px}.ib{min-width:52px;height:52px;border-radius:999px;background:#eef2ff;font-weight:800;font-size:1.3rem}.ib:disabled{opacity:.35}
.pg{min-width:70px;text-align:center;font-weight:800;color:var(--soft)}
#mv{position:fixed;inset:0;z-index:30;background:#05060f;overflow:hidden}#mv[hidden]{display:none}
.lay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.1s ease}.lay.on{opacity:1}
.lay img.b{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(26px) brightness(.55);transform:scale(1.05)}
.lay img.p{position:relative;max-width:96vw;max-height:94vh;box-shadow:0 20px 60px #000a;border-radius:4px;transform-origin:var(--ox,50%) var(--oy,50%)}
.lay.on img.p{animation:kb var(--dur,9s) ease-in-out forwards}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.mt,.mb{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 12px;transition:opacity .5s;z-index:3}
.mt{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);background:linear-gradient(#000b,#0000)}.mt .ttl{flex:1;text-align:center;color:#fff;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{bottom:0;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(#0000,#000b)}
.mb .ib{background:#ffffff26;color:#fff;backdrop-filter:blur(6px)}.mb .ib.off{opacity:.55}.mb .pg{color:#fff}
#mv.idle .mt,#mv.idle .mb{opacity:0}
#mst{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05060fcc;color:#fff;text-align:center}#mst[hidden]{display:none}
#mst b{font:800 2.2rem var(--sans)}#mst i{font:italic 1.1rem var(--serif);opacity:.85}
#tap{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#05060fb0}#tap[hidden]{display:none}#tap button{background:#fff;color:var(--blue);padding:18px 28px;border-radius:18px;font-weight:800;font-size:1.25rem}
.edl{display:grid;gap:12px}.edr{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.edr img{width:110px;border-radius:6px;border:1px solid var(--line)}.edr textarea{width:100%;min-height:84px;font:1rem/1.45 var(--sans);padding:8px;border:1px solid var(--line);border-radius:10px}
.edr small{color:var(--soft);font-weight:700}.edb{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(#f6f8ff00,#f6f8ff 30%)}
.edb button{padding:12px 18px;border-radius:12px;font-weight:800;background:var(--blue);color:#fff}.edb button.o{background:#fff;color:var(--blue);border:1px solid var(--line)}
.pin{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0b1030b3;padding:14px}.pin .c{background:#fff;border-radius:18px;padding:20px;width:min(360px,94vw);text-align:center}.pin input{width:100%;padding:11px;margin:4px 0;border:2px solid var(--line);border-radius:10px;font-size:20px;text-align:center;letter-spacing:.3em}.pin .m{min-height:1.3em;color:#b3261e;font-size:.9rem}.pin .r{display:flex;gap:8px;justify-content:center;margin-top:6px}.pin .r button{border-radius:10px;padding:10px 16px;font-weight:800;background:var(--blue);color:#fff}.pin .r .o{background:#eef2ff;color:var(--ink)}
