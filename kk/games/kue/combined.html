function kxScan(host,items,cb){
 if(host.querySelector(".kxsc"))return;
 var w=document.createElement("div");w.className="kxsc";
 w.innerHTML='<div class="c"><video playsinline muted></video><p><b>\ud83d\udcf7 Scan the learner\u2019s QR card</b><br><i>Itutok ang camera sa QR card ng mag-aaral.</i></p><input placeholder="or type the card code / o itype ang code"><div><button type="button" class="g">\u2b05\ufe0f Back</button></div></div>';
 host.appendChild(w);
 var vid=w.querySelector("video"),inp=w.querySelector("input"),stop=null,run=1;
 function close(){run=0;try{if(stop)stop()}catch(e){}w.remove()}
 w.querySelector("button.g").onclick=close;
 function hit(payload){var t=String(payload||"").trim();if(!t)return false;var idx=-1;
  var m=/^KXL:([^:]+)/i.exec(t);
  if(m)for(var i=0;i<items.length;i++)if(String(items[i].id||"")===m[1]){idx=i;break}
  if(idx<0){var u=t.replace(/^KXL:[^:]*:?/i,"").toUpperCase();if(u)for(var j=0;j<items.length;j++)if(String(items[j].name||"").toUpperCase()===u){idx=j;break}}
  if(idx<0)return false;close();cb(idx);return true}
 inp.onkeydown=function(e){if(e.key==="Enter"&&!hit(inp.value)){inp.style.borderColor="#d7263d";inp.value="";inp.placeholder="No match / walang tugma \u2014 try again"}};
 var BD=window.BarcodeDetector;
 if(BD&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
