:root{--bg:#f2f0ff;--fg:#1b1a3a;--card:#fff;--ac:#5b3fd4;--ok:#16a34a;--no:#dc2626;--mut:#6b6b8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12122a;--fg:#eceaff;--card:#1e1e40;--mut:#a3a3c8}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}#app{max-width:780px;margin:auto;padding:10px}
.ban{background:var(--ban,linear-gradient(135deg,#0e7490,#7a5cf0));color:#fff;border-radius:16px;padding:14px;text-align:center}.ban h1{margin:2px 0;font-size:22px}.ban p{margin:2px}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0002}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;margin:3px;cursor:pointer;background:var(--ac);color:#fff;font-weight:700}
.chip{background:var(--card);color:var(--fg);border:2px solid var(--ac);padding:6px 12px}.chip.on{background:var(--ac);color:#fff}.chip[disabled]{opacity:.4}
.ch{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--ac);margin:6px 0;font-size:19px}
.ok{background:var(--ok)!important;color:#fff!important}.no{background:var(--no)!important;color:#fff!important}.ok .en,.no .en{color:#fff!important;opacity:.92}
.pic{font-size:56px;text-align:center;line-height:1.1}.q{font-size:19px;font-weight:700;margin:6px 0}.sub{color:var(--mut);font-size:13px}.row{display:flex;flex-wrap:wrap;align-items:center}
.bar{height:12px;background:#0002;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--ok)}

const FL=(l,v,r)=>[l,v,r?1:0];
const BIO="Author of the children's story Yng Mula Tung Bulan (Ang Bata sa Buwan / The Child from the Moon). Class adviser and creator of the KORTEX learning games.";
function signModal(title,cb){const m=document.createElement('div');m.className='mod modal';m.innerHTML=`<div class="card"><b>${esc(title)}</b><div class="sub">Sign inside the box with your finger or mouse. A saved signature is locked.</div><canvas id="pad_modal" width="320" height="130" style="border:1px dashed #888;border-radius:8px;background:#fff;touch-action:none;max-width:100%"></canvas><div class="row"><button id="sgS">💾 Save Signature</button><button class="chip" id="sgC">🧹 Clear</button><button class="chip" id="sgX">Cancel</button></div></div>`;document.body.appendChild(m);padInit('modal');const c=document.getElementById('pad_modal');document.getElementById('sgC').onclick=()=>c.getContext('2d').clearRect(0,0,c.width,c.height);document.getElementById('sgX').onclick=()=>m.remove();document.getElementById('sgS').onclick=()=>{cb(c.toDataURL('image/png'));m.remove()}}
const CO=()=>(S.collab||(S.collab={bio:BIO,list:[]}));
function collab(){const C=CO(),vc=CODE+'-'+H(C.list.map(c=>c.n+'|'+c.r).join(';')+C.list.length);return nav('tools')+`<div class="card"><b>🤝 Authorship and Collaboration Record</b><p>This record documents who created <b>GAUNTLET</b> and who contributed to it. It is locked: entries and signatures cannot be edited or removed, so the record stays authentic.</p></div><div class="card"><b>Lead author</b><div class="q" style="font-size:18px">VENICE D. RODRIGUEZ</div><p class="sub">${esc(BIO)}</p><div class="sub">Authorship code: <b>${CODE}-A0-${H('VENICE D. RODRIGUEZ|'+BIO)}</b></div>${C.lead?`<img alt="signature" src="${C.lead}" style="height:50px;background:#fff;border-radius:6px"><div class="sub">🔒 Signed and locked ${esc(C.leadTs||'')}</div>`:`<div class="sub">Not signed yet.</div><div class="row noprint"><button class="chip" onclick="cLead()">✍️ Sign as Lead Author</button></div>`}</div><div class="card"><b>Collaborators</b>${C.list.map((c,i)=>`<div class="card" style="margin:6px 0"><b>${esc(c.n)}</b> 🔒<div class="sub">${esc(c.r)}</div><p>${esc(c.d)}</p><div class="sub">Authorship code: <b>${CODE}-C${String(i+1).padStart(2,'0')}-${H(c.n+'|'+c.r+'|'+c.d)}</b></div>${c.s?`<img alt="signature" src="${c.s}" style="height:46px;background:#fff;border-radius:6px"><div class="sub">Signed and locked ${esc(c.ts)}</div>`:`<div class="sub">Added ${esc(c.ts)}. Not signed yet.</div><div class="row noprint"><button class="chip" onclick="cSign(${i})">✍️ Sign</button></div>`}</div>`).join('')||'<div class="sub">No collaborators added yet.</div>'}<div class="row noprint"><button onclick="cAdd()">➕ Add Collaborator</button><button onclick="window.print()">🖨️ Print Record</button></div></div><div class="card"><p class="sub">Para sa dokumentasyon at sanggunian sa hinaharap ang talang ito. Hindi nito pinapalitan ang pormal na rehistro ng copyright. <i>This record is for documentation and future reference. It does not replace a formal copyright registration.</i></p><div class="sub" style="text-align:center">Generated ${stamp()} • Verification ${vc}</div></div>`}
function cLead(){signModal('Lead author signature',d=>{const C=CO();if(C.lead)return;C.lead=d;C.leadTs=stamp();save();render()})}
function cAdd(){ask('Add collaborator (permanent entry)',[FL('Name','',1),FL('Role','',1),FL('Contribution','',1)],([n,r,d])=>{CO().list.push({n,r,d,ts:stamp(),s:''});save();render()})}
function cSign(i){const c=CO().list[i];if(c.s)return;signModal('Signature: '+c.n,d=>{c.s=d;c.ts=stamp();save();render()})}
const RP={p:'day',d:'',t:1};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pdate=()=>RP.d||ymd(new Date()),LDt=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
function wkR(){const x=new Date(pdate()+'T00:00:00'),m=new Date(x);m.setDate(x.getDate()-((x.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);return[m,e]}
const inP=(d,t)=>{if(RP.p=='term')return t==RP.t;const y=new Date(d+'T00:00:00'),x=new Date(pdate()+'T00:00:00');if(RP.p=='day')return d==pdate();if(RP.p=='week'){const[m,e]=wkR();return y>=m&&y<=e}return y.getFullYear()==x.getFullYear()&&y.getMonth()==x.getMonth()};
const perL=()=>{if(RP.p=='term')return'End of Term '+RP.t;if(RP.p=='day')return'Daily Report • '+LDt(pdate());if(RP.p=='week'){const[m,e]=wkR();return'Weekly Report • '+LDt(ymd(m))+' to '+LDt(ymd(e))}return'Monthly Report • '+new Date(pdate()+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long'})};
const LVL=p=>p==null?'':(s=>p>=s.hi?'Highly Mastered':p>=s.ma?'Mastered':p>=s.ne?'Nearly Mastered':'Not Mastered')(window.KXSTD?KXSTD():{hi:90,ma:80,ne:70});
const RS=['ok','no','ref','ex','na'],RI={ok:'✅',no:'❌',ref:'🙅',ex:'⌛',na:'➖'};
const smy=a=>{const n=a.length,ok=a.filter(r=>r.s=='ok').length;return{n,ok,p:n?Math.round(100*ok/n):null,pts:a.reduce((q,r)=>q+(r.pts||0),0)}};
function RECS(){const o=[],kn=(s,t,g)=>PRE[s]+' '+((MT[t]&&MT[t][g])||['','','Event'])[2];S.res.forEach(r=>{o.push({l:r.lid,sub:r.sub,t:r.t,d:ymd(new Date(r.ts||Date.now())),k:kn(r.sub,r.t,r.g),o:r.g,s:stOf(r),pts:r.pts||0,c:CLs(r.sub,r.t)[cpOf(r.sub,r.t,r.i)]||null})});S.grp.forEach(g=>{const ss=S.gs.find(x=>x.sid==g.sid);if(!ss)return;const T=ss.teams[g.team];if(!T)return;T.m.forEach(l=>o.push({l,sub:g.sub,t:g.t,d:ymd(new Date(ss.ts)),k:kn(g.sub,g.t,g.g)+' (group)',o:20+g.g,s:g.s||(g.ok?'ok':'no'),pts:g.pts||0,c:CLs(g.sub,g.t)[cpOf(g.sub,g.t,g.i)]||null}))});return o}

const myRecs=l=>RECS().filter(r=>r.l==l&&inP(r.d,r.t));
function lrnsIn(){const set=new Set();RECS().forEach(r=>{if(inP(r.d,r.t))set.add(r.l)});return act().filter(r=>set.has(r.id)).map(r=>r.id)}
function repData(l){const a=myRecs(l),bySub={},byK={},byC={};a.forEach(r=>{(bySub[r.sub]=bySub[r.sub]||[]).push(r);const kk=r.sub+'|'+String(r.o||0).padStart(3,'0')+'|'+r.k;(byK[kk]=byK[kk]||[]).push(r);if(r.c)(byC[r.sub+'|'+r.c]=byC[r.sub+'|'+r.c]||[]).push(r)});const subs=Object.keys(bySub).map(s=>({s,...smy(bySub[s])})).sort((x,y)=>x.p-y.p),comps=Object.entries(byC).map(([c,x])=>({c:c.split('|').slice(1).join('|'),...smy(x)})).sort((x,y)=>x.p-y.p);return{a,T:smy(a),subs,byK,comps}}
function repPage(l){const D=repData(l),T=D.T,st=stamp(),p=S.prof,weak=D.subs[0],tips=weak&&TIPS[weak.s]?TIPS[weak.s]:[],msg=T.p>=80?'Keep it up! Continue the daily reading, counting and good habits at home.':T.p>=70?'Nearly there. Please reinforce the least mastered competency below at home.':'Remediation is needed. Please practice the tasks below with your child for 10 minutes every day.',vc=CODE+'-R-'+H(fnm(l)+'|'+perL()+'|'+T.n+'|'+T.ok);
return`<div class="cert pg" style="text-align:left;background:#fff;color:#222;border-width:3px"><div style="text-align:center"><b>${esc([p.short||p.school,p.sid].filter(Boolean).join(' • '))}</b><br>⚔️ Learner Progress Report • ${esc(perL())}<br><small>${esc(p.grade||'')}${p.sec?' - '+esc(p.sec):''} • SY ${esc(p.sy||'')}</small></div><h3 style="margin:8px 0 0">${esc(fnm(l))}</h3>${lrnH(l)}<div>Overall score: <b>${T.p}%</b> • ${LVL(T.p)} • Correct ${T.ok} of ${T.n}${T.pts?' • Points '+T.pts:''}</div><div class="sub">Responses: ${RS.map(k=>RI[k]+' '+D.a.filter(r=>r.s==k).length).join(' • ')}. Only ✅ earns points.</div>
<b>By subject</b><table><tr><th>Subject</th><th>Correct</th><th>Score</th><th>Level</th></tr>${D.subs.map(x=>`<tr><td>${esc(x.s)}</td><td>${x.ok}/${x.n}</td><td>${x.p}%</td><td>${LVL(x.p)}</td></tr>`).join('')}</table>
<b>Games and exams</b><table><tr><th>Subject and Component</th><th>Correct</th><th>Score</th></tr>${Object.keys(D.byK).sort().map(k=>{const x=smy(D.byK[k]),q=k.split('|');return`<tr><td>${esc(q[0])} • ${esc(q.slice(2).join('|'))}</td><td>${x.ok}/${x.n}</td><td>${x.p}%</td></tr>`}).join('')}</table>
<b>Competencies</b><table><tr><th>Competency</th><th>Score</th><th>Level</th></tr>${D.comps.map((x,i)=>`<tr><td>${esc(x.c)}</td><td>${x.p}%</td><td>${i==0?'⚠️ Least mastered: ':(i==D.comps.length-1&&D.comps.length>1?'⭐ Most mastered: ':'')}${LVL(x.p)}</td></tr>`).join('')}</table>
<p><b>${msg}</b></p>${tips.length?`<b>Home guide${weak?' • '+esc(weak.s):''}</b><ul>${tips.map(t=>`<li>${esc(t[0])}<br><small>${esc(t[1])}</small></li>`).join('')}</ul>`:''}${sigH(st)}<div style="margin-top:10px">Parent's signature: ____________________ Date: __________</div><div class="sub" style="text-align:center">Generated ${esc(st)} • Verification ${vc}</div></div>`}
function certR(l){const D=repData(l),T=D.T;if(!T.n)return'';const st=stamp(),p=S.prof,ti=T.p>=80?'Certificate of Achievement':T.p>=70?'Certificate of Progress':'Certificate of Participation',best=D.subs[D.subs.length-1],vc=CODE+'-C-'+H(fnm(l)+'|'+perL()+'|'+T.p);return`<div class="cert pg"><div><b>${esc([p.short||p.school,p.sid].filter(Boolean).join(' • '))}</b></div><div class="sub">${esc(p.school||'')}</div><div>⚔️ GAUNTLET • The Decathlon Suite</div><h2>${ti}</h2><div>is proudly awarded to</div><h2>${esc(fnm(l))}</h2>${lrnH(l)}<div>${esc(perL())}</div><div>Overall score ${T.p}% • ${LVL(T.p)}</div><div>Correct answers: ${T.ok} of ${T.n}${T.pts?' • Points: '+T.pts:''}</div>${best&&D.subs.length>1?`<div>Strongest subject: ${esc(best.s)} (${best.p}%)</div>`:''}<div>${T.p>=70?'Congratulations!':'Keep practicing. You are on your way!'}</div>${sigH(st)}<div class="sub" style="margin-top:8px">Issued ${esc(st)} • Verification ${vc}</div></div>`}
function clsPage(){const ids=lrnsIn(),subs=KXCUR.up(['GMRC','LANGUAGE','MAKABANSA','MATHEMATICS','READING & LITERACY']);const R=RECS().filter(r=>inP(r.d,r.t));return`<div class="cert pg" style="text-align:left;background:#fff;color:#222;border-width:3px"><div style="text-align:center"><b>⚔️ Class Summary • ${esc(perL())}</b></div><table><tr><th>Learner</th>${subs.map(s=>`<th>${esc((function(s){var x=window.KXLVN?KXLVN.swap(s):s;return x!==s&&/\s/.test(x.trim())?x.trim().split(/\s+/).map(function(w){return w.charAt(0)}).join(''):x.slice(0,6)})(s))}</th>`).join('')}<th>All</th></tr>${ids.map(l=>{const a=R.filter(r=>r.l==l);return`<tr><td>${esc(nm(l))}</td>${subs.map(s=>{const x=smy(a.filter(r=>r.sub==s));return`<td>${x.p==null?'-':x.p}</td>`}).join('')}<td><b>${smy(a).p}</b></td></tr>`}).join('')}</table><div class="sub">Scores are percentages. Class mean (MPS): ${ids.length?Math.round(ids.reduce((q,l)=>q+smy(R.filter(r=>r.l==l)).p,0)/ids.length):'-'} • Generated ${esc(stamp())}</div></div>`}
function rpt(){const L1=lrnsIn();return nav('tools')+`<div class="card"><b>📅 Reports and Certificates</b><div class="sub">Choose a period. Reports and certificates are made from the saved game results. Back up first, then print or save as PDF.</div><div class="row">${[['day','Daily'],['week','Weekly'],['month','Monthly'],['term','End of Term']].map(x=>`<button class="chip ${RP.p==x[0]?'on':''}" onclick="RP.p='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${RP.p=='term'?`<div class="row">${KXCUR.tn().map(t=>`<button class="chip ${RP.t==t?'on':''}" onclick="RP.t=${t};render()">Term ${t}</button>`).join('')}</div>`:`<label class="sub">Date<input type="date" value="${pdate()}" onchange="RP.d=this.value;render()"></label>`}<div class="sub"><b>${esc(perL())}</b> • ${L1.length} learner(s) with results</div></div><div class="card"><div class="row">${L1.map(l=>`<button class="chip" onclick="go({s:'rptv',rl:'${l}'})">${esc(nm(l))}</button>`).join('')||'<div class="sub">No results in this period.</div>'}</div>${L1.length?`<div class="row"><button onclick="go({s:'rptv',rl:'all'})">🖨️ Reports and Certificates (All)</button><button class="chip" onclick="go({s:'rptv',rl:'cls'})">📋 Class Summary</button><button class="chip" onclick="go({s:'rptv',rl:'cert'})">🎓 Certificates Only</button></div>`:''}</div>`}
function rptv(){const all=['all','cls','cert'].includes(v.rl),L1=all?lrnsIn():[v.rl];const h=v.rl=='cls'?clsPage():L1.map(l=>v.rl=='cert'?certR(l):repPage(l)+certR(l)).join('');return nav('rpt')+`<div class="row noprint"><button onclick="window.print()">🖨️ Print or Save as PDF</button></div>`+(h||'<div class="card sub">No results in this period.</div>')}

function cpAll(){const t=document.getElementById('allc');if(!t)return;t.select();try{document.execCommand('copy')}catch(e){}toast('Copied. Paste it in a message to your teacher.')}
function shAll(){const t=document.getElementById('allc');if(!t)return;if(navigator.share)navigator.share({title:'My results',text:t.value}).catch(()=>{});else cpAll()}
function svAll(){const t=document.getElementById('allc');if(!t)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.value],{type:'text/plain'}));a.download='my-results.txt';a.click()}
function impFile(){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='.txt,.json,text/plain';i.onchange=()=>{[...i.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const t=document.querySelector('#ic');t.value=(t.value?t.value+'\n':'')+String(r.result);toast('File loaded. Tap Import.')};r.readAsText(f)})};i.click()}
const exitRow=()=>COMBINED?'<div class="row noprint"><button class="chip" onclick="roleExit()">🚪 Exit to Role Menu</button></div>':'';
const ROLEHTML=`<div class="card" style="text-align:center"><div class="pic">⚔️</div><div class="q">Teacher. / Learner.</div><div class="row"><button class="big" onclick="roleT()">👩‍🏫 Teacher</button><button class="big" onclick="roleL()">🎒 Learner</button></div><div class="sub">Learners cannot open the teacher tools. The teacher PIN is required. This file holds private learner details, so keep it for the teacher only.</div></div>`;
const RCVSTEPS=`<ol><li>The learner opens the learner file on the same phone and taps <b>📤 My Results</b>.</li><li>The learner taps <b>Copy all</b>, <b>Share</b> or <b>Save file</b> and sends it to you by message or email.</li><li>You open <b>Tools → Import Results</b>, then paste the codes or tap <b>Load results file</b>, then tap <b>Import</b>.</li><li>Every code is checked. The name must match your roster, edited codes are rejected and nothing is counted twice.</li></ol><p class="sub">Kung naisara ng mag-aaral ang app nang hindi nakokopya: nasa browser pa rin ng teleponong iyon ang mga resulta. Ipabukas muli sa mag-aaral ang parehong learner file at gamitin ang My Results. Huwag burahin ang data ng browser, at huwag buksan ang kopyang ipinasa sa chat, dahil bubukas ang kopya bilang bagong pahina na walang naka-save na resulta. Ang mga resulta lamang ng pagsusulit na ginawa sa telepono ng mag-aaral ang may code. Naka-save na sa device ng guro ang mga larong nilaro roon. <i>If a learner closed the app without copying: the results are still inside that phone's browser. Ask the learner to open the same learner file again and use My Results. Do not clear the browser data, and do not open a copy that was forwarded in a chat, because a copy opens as a new page with no saved results. Only exam results made on the learner's phone have codes. Games run on the teacher's device are already saved there.</i></p>`;

function kxNT(){try{var s=JSON.parse(localStorage.getItem("KORTEX_SESS")||"null");return!!(s&&s.role&&s.role!=="teacher")}catch(e){return false}}
function role(){return kxNT()?ROLEHTML.replace("<button class=\"big\" onclick=\"roleT()\">👩‍🏫 Teacher</button>",""):ROLEHTML}
function roleL(){LEARNER=true;v.s='home';render()}
function roleT(){if(kxNT())return;UN=0;pin(()=>{LEARNER=false;UN=1;v.s='home';render()})}
function roleExit(){LEARNER=true;UN=0;G=null;v.s='role';render()}
function codeS(l,sub,t,g){const rs=S.res.filter(r=>r.lid==l&&r.sub==sub&&r.t==t&&r.g==g).map(r=>[r.i,r.ok,r.pts,r.tab||0,stOf(r)]),o={l,n:nm(l),s:sub,t,g,r:rs,e:Date.now()},b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));return'OL1.'+b+'.'+H(b)}
