.kxstar .ms-k{text-align:center;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;min-width:92px}.kxstar .ms-k span{display:block;font:800 18px Georgia,serif}.kxstar .ms-k small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.kxstar .ms-l{font:700 11px system-ui;letter-spacing:.12em;text-transform:uppercase;margin:12px 0 6px;opacity:.9}
.kxstar .ms-b{display:flex;flex-wrap:wrap;gap:6px}.kxstar .ms-b span{display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 8px;min-width:64px;opacity:.35;filter:grayscale(1)}.kxstar .ms-b span.on{opacity:1;filter:none;background:rgba(255,255,255,.16);box-shadow:0 0 0 2px #f3d58a}.kxstar .ms-b i{font:600 9.5px system-ui;font-style:normal;margin-top:4px;text-align:center;max-width:72px}
.kxstar .ms-p{display:flex;flex-wrap:wrap;gap:5px}.kxstar .ms-p span{font:700 12px system-ui;border-radius:999px;padding:5px 9px;background:rgba(0,0,0,.2)}.kxstar .ms-p .done{background:#2f7d4f}.kxstar .ms-p .now{background:#f3d58a;color:#3b2a05;box-shadow:0 0 0 2px #fff}.kxstar .ms-p .lock{opacity:.55}.kxstar .ms-p .open{background:rgba(255,255,255,.18)}
.kxstar .ms-h{font-size:11.5px;opacity:.85;margin:6px 0 0}
.kxstar .ms-r{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kxstar .ms-r button{border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.18);color:#fff;border-radius:14px;padding:10px 6px;font:800 15px system-ui;cursor:pointer}.kxstar .ms-r button small{display:block;font:500 11px system-ui;font-style:italic;opacity:.85;margin-top:2px}.kxstar .ms-r button.on{background:#fff;color:#3b2a05;border-color:#fff}
.kxstar .ms-t{margin:0;padding-left:22px}.kxstar .ms-t li{margin:3px 0}
/* Who needs help */
.hp-r{display:grid;grid-template-columns:minmax(110px,30%) 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed rgba(201,162,74,.4)}.hp-n{font-weight:700}.hp-w{font-size:.9em}.hp-w small{opacity:.8}
.hp-b{border:0;border-radius:10px;padding:8px 10px;background:#2a9d62;color:#fff;font:700 12.5px system-ui;cursor:pointer;white-space:nowrap}
.msn-hp .hp-r{border-top-color:rgba(255,255,255,.25);font-size:13px}.msn-all{margin-top:6px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font:700 12px system-ui;cursor:pointer}
@media (max-width:520px){.hp-r{grid-template-columns:1fr auto}.hp-w{grid-column:1/-1;grid-row:2}}
/* Class points */
.pt-w{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.pt-c{border:1px solid rgba(201,162,74,.5);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}.pt-c b{font-size:15px}.pt-s{font:800 14px system-ui;color:#2a9d62}
.pt-b{display:flex;gap:4px;flex-wrap:wrap}.pt-b button{border:1px solid rgba(201,162,74,.6);background:rgba(255,255,255,.06);border-radius:10px;font-size:22px;padding:6px 8px;cursor:pointer;line-height:1}.pt-b button:active{transform:scale(.92)}
.pt-c.pop{animation:ptpop .45s ease}@keyframes ptpop{40%{transform:scale(1.04);box-shadow:0 0 0 3px #f3d58a}}
.st-lb{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:.92em}
/* teacher note and announcement in the Parent Dashboard */
.pd-tn{margin:0 0 10px}.pd-tn summary{cursor:pointer;font-weight:700}.pd-tn label{display:block;margin:8px 0 0;font-size:.9em}.pd-tn textarea{width:100%;box-sizing:border-box;margin-top:4px;border-radius:10px;padding:8px;font:14px system-ui}

#edm{color:#f3dea0;text-align:center;font:italic 600 .95rem Georgia,serif;margin:-8px 0 12px;opacity:.95}
.abpromo{font-size:1.05em;border-left:4px solid #d9b25a;padding-left:10px}
#kbI[hidden]{display:none!important}

/* 🖨️ Worksheets panel */
.wsx label{font-weight:600}.wsx label>select{display:block;width:100%;margin:4px 0 8px;padding:9px 10px;border:2px solid var(--line,#d8cfb4);border-radius:10px;font:600 1rem system-ui,sans-serif;background:#fff;color:#14284b}.wsx2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wsx .st-lb{font-weight:400}

/* v1.0: version under the tagline; English line under Filipino headings for learners and parents */
.si-v{margin:2px 0 0;font:600 .72rem system-ui,sans-serif;letter-spacing:.08em;opacity:.65}.si-q .si-en{display:block;font-size:.62em;font-style:italic;font-weight:500;opacity:.82;margin-top:2px}#pcM i,.si-s i,.si-note i{opacity:.85}

/* 🏫 Ground State: School And Teacher Profile */
.prf .prg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 14px}.prf .prg label{font-weight:600}.prf .prg input{margin:4px 0 6px}.prf .prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}.prf .prsg{border:1px dashed var(--line,#d8cfb4);border-radius:12px;padding:10px}.prf .prsg canvas{display:block;width:100%;max-width:420px;height:auto;aspect-ratio:420/130;background:#fff;border:2px dashed #b9c3dc;border-radius:10px;touch-action:none;margin:6px 0}.prf .prup{display:inline-flex;align-items:center;cursor:pointer}
.abtoc button.on{background:#c9a24a;color:#1d1540}

/* Tools: a tool opens alone, at the top */
.tl.solo>*:not(.axh):not(.tsolo):not(.tp.show):not(.msg){display:none!important}.tl .tsolo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:6px 0 12px}.tl .tsolo h3{margin:0;font-size:1.3rem}.tl .tsolo h3 small{display:block;font-size:.8rem;opacity:.75;font-weight:600}.tl.solo .tp.show{display:block}

/* Item Bank editor */
.ibk label{display:block;font-weight:600}.ibk label>select,.ibk label>input{display:block;width:100%;margin:4px 0 8px;padding:9px 10px;border:2px solid var(--line,#d8cfb4);border-radius:10px;font:600 1rem system-ui,sans-serif;background:#fff;color:#14284b;box-sizing:border-box}
.ibk .ibf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ibk .ibc{margin:2px 0 8px}.ibk .ibg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px;margin:6px 0}
.ibk .ibfm{border:2px solid #c9a24a;border-radius:14px;padding:10px 14px;margin:10px 0;background:rgba(201,162,74,.08)}.ibk .ibfm h4{margin:2px 0 8px}
.ibk ol.ibl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}.ibk ol.ibl li{border:1.5px solid var(--line,#d8cfb4);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.55)}
.ibk .ibh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.ibk .ibt{font:700 .72rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:#e7ecf8;color:#1d3a78}
.ibk li.ib-edited .ibt{background:#fff1cf;color:#7a4b00}.ibk li.ib-added .ibt{background:#dff5e6;color:#14602e}.ibk .ibn{font-weight:700;opacity:.7}
.ibk .ibq{font-size:1.02rem;line-height:1.4}.ibk .ibq .em{font-size:1.3rem}.ibk .ibch{font-size:.92rem;line-height:1.5;margin:4px 0;color:#2b3550}.ibk .ibk2{font-size:.9rem;margin-bottom:6px}
.ibk .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ibk .btn.sm{padding:6px 12px;font-size:.88rem}

/* Reading Log */
.rdx label{display:block;font-weight:600}.rdx label>input,.rdx label>select{display:block;width:100%;margin:4px 0 8px;padding:9px 10px;border:2px solid var(--line,#d8cfb4);border-radius:10px;font:600 1rem system-ui,sans-serif;background:#fff;color:#14284b;box-sizing:border-box}
.rdx .rdf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px}.rdx .rdf .rdb{grid-column:span 2}.rdx .rdl{margin:8px 0 4px}.rdx .rdq{margin-left:8px}
.rdx .rdm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rdx .rdm input{width:90px;margin:0;padding:8px 10px}
.rdx .rd-m,.rdx .rd-f{border:2px solid var(--line,#d8cfb4);background:#fff;color:#14284b;border-radius:12px;padding:9px 16px;font:700 1rem system-ui,sans-serif;cursor:pointer;min-height:44px}.rdx .rd-f i{font-weight:500;opacity:.7;font-size:.82em}
.rdx .rd-m.on,.rdx .rd-f.on{background:#14284b;color:#fff;border-color:#14284b}
.rdx .rdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.rdx .rd-c{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line,#d8cfb4);background:#fff;color:#14284b;border-radius:12px;padding:8px 12px;font:700 .98rem system-ui,sans-serif;cursor:pointer;min-height:48px}.rdx .rd-c small{font-weight:500;opacity:.7;font-size:.74rem}
.rdx .rd-c.on{background:#e3f4e8;border-color:#2f8f4e}.rdx .rd-c.on span:before{content:"✓ "}
.rdx table.rdt{width:100%;border-collapse:collapse;font-size:.9rem}.rdx table.rdt th,.rdx table.rdt td{padding:6px 8px;border-bottom:1px solid var(--line,#e5dcc0);text-align:left}.rdx table.rdt .num{text-align:right}

/* ---------- periods ---------- */
function isoWeekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function inPeriod(r,f){
 if(f.game&&f.game!=="all"&&r.g!==f.game)return false;
 if(f.period==="term"||f.period==="eosy"){var y=f.sy==null?KXSY.y():+f.sy;if(r.ts){if(syOfTs(r.ts)!==y)return false}else if(y!==KXSY.y())return false;return f.period==="eosy"||r.t===+f.term}
 var d=new Date(r.ts);if(!r.ts)return false;
 var ref=f.date?new Date(f.date+"T12:00:00"):new Date();
 if(f.period==="day")return ymd(d)===ymd(ref);
 if(f.period==="week"){var a=isoWeekStart(ref).getTime(),b=a+7*864e5;return r.ts>=a&&r.ts<b}
 if(f.period==="month")return d.getFullYear()===ref.getFullYear()&&d.getMonth()===ref.getMonth();
 return true;
}
function periodLabel(f){
 var N={day:"Daily",week:"Weekly",month:"Monthly",term:"End Of Term",eosy:"End Of School Year"},ref=f.date?new Date(f.date+"T12:00:00"):new Date();
 var L=N[f.period]||"All",sy=KXSY.label(f.sy==null?KXSY.y():+f.sy);
 if(f.period==="day")return L+" · "+ymd(ref);
 if(f.period==="week"){var a=isoWeekStart(ref),b=new Date(a.getTime()+6*864e5);return L+" · "+ymd(a)+" to "+ymd(b)}
 if(f.period==="month")return L+" · "+ymd(ref).slice(0,7);
 if(f.period==="term")return L+" · Term "+f.term+" · "+sy;
 return L+" · "+sy}

 L.sort(function(a,b){return b.pct-a.pct||a.n.localeCompare(b.n)});

function fpId(){return ls("KORTEX_FP")||""}
function fpFile(){try{return location.protocol==="file:"||location.protocol==="content:"||location.origin==="null"||window.top!==window}catch(e){return true}}

function fpB64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function fpUnb64(t){var s=atob(t),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}

/* KORTEX Item Bank: the teacher edits the shared BOW questions once in KORTEX (Tools → 📚 Item Bank) and they are saved as KORTEX_BANK.
   Format: {v:1,w:{"term|subject|week":{e:{"<index>":item},a:[item,...]}}}.  An item is [Filipino question, English question,
   [4 Filipino choices], [4 English choices], correct index 0-3, emoji, (optional picture)].
   Original items keep their place (they can be reworded, never removed) so item numbers in saved scores stay true; added items
   go to the end of the week. Nothing here changes the authorship fingerprints of the games. */
(function(){

  apply:function(obj){if(!obj||typeof obj!=="object")return 0;

function mergeRead(arr){var a=rdAll(),have={},n=0;a.forEach(function(e){have[[e.id,e.d,e.t,e.m,e.ts].join("|")]=1});
 arr.forEach(function(e){if(!e||!e.n||!e.t||!e.d)return;var L=learnerOf(e.n),id=(L&&L.id)||e.id,k=[id,e.d,e.t,e.m,e.ts].join("|");if(have[k])return;have[k]=1;a.push({id:id,n:L&&L.short?L.short:e.n,d:e.d,ts:e.ts||0,t:e.t,m:+e.m||0,f:e.f||"🙂",w:e.w||"c",a:e.a?1:0});n++});
 if(n)rdSave(a);return n}
