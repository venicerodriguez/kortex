am.\", \"One less than ten is nine.\"], [\"Magbilang pababa mula lima hanggang isa.\", \"Count down from five to one.\"]], \"2|1|2\": [[\"Ang unang tunog ng bola ay /b/.\", \"The first sound of ball is /b/.\"], [\"Basahin natin ang ba, be, bi, bo, bu.\", \"Let us read ba, be, bi, bo, bu.\"], [\"Si Lola ay may mesa.\", \"Grandma has a table.\"], [\"Ang mama ay nasa bahay.\", \"Mother is at home.\"], [\"Ang pato ay lumalangoy.\", \"The duck is swimming.\"]], \"2|1|3\": [[\"Ang tulay ay mahaba.\", \"The bridge is long.\"], [\"Ang mga bata ay naglalaro.\", \"The children are playing.\"], [\"Ang mansanas ay pula.\", \"The apple is red.\"], [\"Si Tito ay may malaking bangka.\", \"Uncle has a big boat.\"], [\"Ang ibon ay lumilipad sa langit.\", \"The bird flies in the sky.\"]], \"3|1|2\": [[\"Buksan mo ang iyong aklat.\", \"Open your book.\"], [\"Sino ang guro mo?\", \"Who is your teacher?\"], [\"Mahal ko ang nanay at tatay ko.\", \"I love my mother and father.\"], [\"Wow, ang ganda ng larawan!\", \"Wow, the picture is beautiful!\"], [\"Si Ate ay nag-aaral.\", \"Big sister is studying.\"]], \"3|1|3\": [[\"Magandang hapon po, Sir.\", \"Good afternoon, Sir.\"], [\"Salamat po sa tulong ninyo.\", \"Thank you for your help.\"], [\"Paumanhin po, Ma'am.\", \"Excuse me, Ma'am.\"], [\"Ang pusa ay malambot.\", \"The cat is soft.\"], [\"Ipinakita ko ang guhit ko kay Nanay.\", \"I showed my drawing to Mother.\"]], \"4|1|2\": [[\"Sasabihin ko ang totoo.\", \"I will tell the truth.\"], [\"Mabait akong kaibigan.\", \"I am a kind friend.\"], [\"Tatawagin ko ang kaklase ko sa tamang pangalan.\", \"I will call my classmate by the right name.\"], [\"Hindi ako nagsisinungaling.\", \"I do not lie.\"], [\"Pantay ang turing ko sa lahat.\", \"I treat everyone equally.\"]], \"4|1|3\": [[\"Masaya akong nakikipaglaro sa iba.\", \"I happily play with others.\"], [\"Nauunawaan ko ang pagkakaiba natin.\", \"I understand our differences.\"], [\"Tapat ako sa mga kaibigan ko.\", \"I am loyal to my friends
