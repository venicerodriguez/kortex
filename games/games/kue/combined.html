<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script>/* KORTEX school year engine.
   Opening day changes every year with the DepEd order, so the school year follows the School Calendar the teacher saves:
   a school year begins on the opening day she sets (Term 1, Review Opens) and stays until the next opening day she sets.
   Nothing moves on a fixed date. Safety nets: with no calendar saved yet, the DepEd three-term pattern (SY 2026-2027) is used
   for the school year that starts in June; and if no new calendar is set within about five months after a school year's last day,
   KORTEX moves on with estimated dates (each date kept on the same weekday) until she sets the real ones.
   Each school year's first and last day are remembered (KX_SYDAYS) so past results stay under the right school year. */
(function(){
if(window.KXSY)return;
var BASE=2026,TPL={lock:1,all:0,d:{'1':{rev:'2026-06-08',sum1:'2026-07-06',sum2:'2026-07-28',exam:'2026-09-01'},'2':{rev:'2026-09-16',sum1:'2026-10-07',sum2:'2026-10-29',exam:'2026-12-03'},'3':{rev:'2027-01-04',sum1:'2027-01-25',sum2:'2027-02-16',exam:'2027-03-15'}},end:{'1':'2026-09-15','2':'2026-12-18','3':'2027-04-08'}};
var GAP=151,DAY=864e5;   // days after a school year's last day before KORTEX moves on by itself
function p2(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dt(s){if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}

function syOf(c){var r=c&&c.d&&c.d['1']&&c.d['1'].rev;if(!r||!/^\d{4}-\d\d/.test(r))return null;var p=r.split('-');return +p[0]-((+p[1])<=3?1:0)}
function lastOf(c,s){var L=(c&&c.end&&c.end['3'])||shift(TPL.end['3'],s-BASE),x=c&&c.d&&c.d['3']&&dt(c.d['3'].exam),l=dt(L);if(x){x=new Date(x.getTime()+21*DAY);if(!l||x>l)l=x}return l?ymd(l):''}
function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}
var C={t:0,k:''};
function state(){var now=Date.now();if(now-C.t<1500&&C.v)return C.v;var a=rd('KX_CAL')||'',b=rd('KX_SYDAYS')||'';if(C.v&&C.k===a+'|'+b){C.t=now;return C.v}
 var c=null,h={};try{c=JSON.parse(a||'null')}catch(e){}try{h=JSON.parse(b||'{}')||{}}catch(e){h={}}
 var s=syOf(c);if(s!=null&&c.d['1'].rev){var o=c.d['1'].rev,l=lastOf(c,s);if(!h[s]||h[s].o!==o||h[s].l!==l){h[s]={o:o,l:l};try{localStorage.setItem('KX_SYDAYS',JSON.stringify(h));b=JSON.stringify(h)}catch(e){}}}else c=null;
 C={t:now,k:a+'|'+b,v:{c:c,s:s,h:h}};return C.v}
/* B(yy): the moment school year yy begins = the opening day she set; else five months after the last day of the year before; else June 1 */
function B(yy,st){st=st||state();var h=st.h,o=h[yy]&&dt(h[yy].o);if(o)return o;var l=h[yy-1]&&dt(h[yy-1].l);if(l){var x=new Date(l.getTime()+GAP*DAY);return x>june(yy)?x:june(yy)}return june(yy)}

function move(c,n){var o={lock:c.lock==null?1:c.lock,all:c.all?1:0,d:{}};Object.keys(c.d||{}).forEach(function(t){var x=c.d[t]||{};o.d[t]={};Object.keys(x).forEach(function(k){o.d[t][k]=shift(x[k],n)})});if(c.end){o.end={};Object.keys(c.end).forEach(function(t){o.end[t]=shift(c.end[t],n)})}o.sy=(syOf(c)||BASE)+n;o.est=1;return o}

function cal(saved){var Y=y();if(saved&&saved.d){var s=syOf(saved);if(s==null||Y<=s){if(saved.sy==null)saved.sy=(s==null?Y:s);return saved}return move(saved,Y-s)}return move(TPL,Y-BASE)}

function ended(){var st=state(),now=new Date();if(st.s==null||y(now)!==st.s||st.h[st.s+1])return false;var l=dt(st.h[st.s]&&st.h[st.s].l);return !!(l&&now>l)}
function s(sep,yy){yy=yy==null?y():yy;return yy+(sep||'-')+(yy+1)}
function label(yy){return'SY '+s('–',yy)}
function roll(str,Y){Y=Y==null?y():Y;return String(str).replace(/(20\d\d)(\s*[-–]\s*)(20\d\d)/,function(m,a,sp,b){a=+a;b=+b;return(b===a+1&&a<Y)?Y+sp+(Y+1):m})}

 start:function(yy){return B(yy).getTime()},end:function(yy){return B(yy+1).getTime()},saved:function(){return state().s}};
})();
</script><script>/* KORTEX masterlist: when the teacher imports a class list in KORTEX Tools, every game adopts it the next time it opens.
   Learners keep their saved results; names are matched so no score is lost. */
(function(){try{
var M=null;try{M=JSON.parse(localStorage.getItem("KORTEX_ROSTER")||"null")}catch(e){}
M=(Array.isArray(M)?M:[]).filter(function(r){return r&&r.name&&r.lrn!=="123456789012"&&!/^SURNAME, GIVEN/i.test(r.fn||"")});
if(!M.length&&Array.isArray(window.__KXROS)&&window.__KXROS.length){M=window.__KXROS;try{localStorage.setItem("KORTEX_ROSTER",JSON.stringify(M))}catch(e){}}
if(!M.length)return;
var sig=JSON.stringify(M.map(function(r){return[r.name,r.emoji||"",r.fn||""]}));
function nk(s){return String(s==null?"":s).toUpperCase().replace(/[^A-Z0-9]+/g," ").trim()}
function match(list,getName){var o={};(list||[]).forEach(function(x){o[nk(getName(x))]=x});return o}
function each(re,fn){var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(re.test(k))ks.push(k)}ks.forEach(function(k){if(localStorage.getItem("KX_RSIG_"+k)===sig)return;var S;try{S=JSON.parse(localStorage.getItem(k)||"null")}catch(e){return}if(!S||typeof S!=="object"||!Array.isArray(S.roster))return;var R=fn(S.roster);if(!R)return;S.roster=R;try{localStorage.setItem(k,JSON.stringify(S));localStorage.setItem("KX_RSIG_"+k,sig)}catch(e){}})}
each(/^(gg1_|lg1_|cn1_|pbp1_|atn1_)/,function(old){var m=match(old,function(x){return x.n});return M.map(function(r){var o=m[nk(r.name)]||{};return{n:r.name,e:r.emoji||o.e||"⭐",fn:r.fn||o.fn||"",lrn:r.lrn||o.lrn||"",qr:o.qr||"",p:o.p==null?1:o.p}})});
each(/^bb_codex_.*_v3$/,function(old){var m=match(old,function(x){return x.name}),n=0;return M.map(function(r){var o=m[nk(r.name)];n++;return{id:o?o.id:"M"+n,name:r.name,em:r.emoji||(o&&o.em)||"⭐",full:r.fn||(o&&o.full)||"",lrn:r.lrn||(o&&o.lrn)||"",sex:(o&&o.sex)||"",note:(o&&o.note)||""}})});
each(/^CDX_MONTAGE_V1_/,function(old){var m=match(old,function(x){return x.name}),n=0;return M.map(function(r){var o=m[nk(r.name)];n++;return{id:o?o.id:"M"+n,name:r.name,em:r.emoji||(o&&o.em)||"⭐",fn:r.fn||(o&&o.fn)||"",lrn:r.lrn||(o&&o.lrn)||""}})});
each(/^(bpp|bppML|bprime)$/,function(old){var m=match(old,function(x){return x.nk||x.n});return M.map(function(r){var o=m[nk(r.name)]||{};return{n:r.fn||r.name,p:o.p==null?1:o.p,lrn:r.lrn||o.lrn||"",nk:r.name,em:r.emoji||o.em||"⭐",qr:o.qr||""}})});
each(/^arena2$/,function(old){var m=match(old,function(x){return x.name}),n=0;return M.map(function(r){var o=m[nk(r.name)];n++;return{id:o?o.id:"M"+n,name:r.name,full:r.fn||(o&&o.full)||"",lrn:r.lrn||(o&&o.lrn)||"",em:r.emoji||(o&&o.em)||"⭐"}})});
each(/^olympians$/,function(old){var m=match(old,function(x){return x.name}),n=0;return M.map(function(r){var o=m[nk(r.name)];n++;return{id:o?o.id:"M"+String(n).padStart(3,"0"),name:r.name,em:r.emoji||(o&&o.em)||"⭐",g:(o&&o.g)||r.g||"",arch:(o&&o.arch)||0}})});
}catch(e){}})();
</script><script>/* KORTEX fair timing: a question's timer waits while the learner's name is on screen, while the rules are open,

(function(){if(window.__kxHeld)return;var since=0;
window.__kxHeld=function(){var h=false;try{h=!!(document.getElementById("kxpk")||document.getElementById("kxrules")||document.getElementById("kxatt")||(window.speechSynthesis&&speechSynthesis.speaking))}catch(e){}

</script><script>/* KORTEX profile in every game: school, teacher, school head, motto and signatures are typed once in KORTEX
   (Tools → 🏫 Ground State) and saved as KORTEX_PROFILE. Each game copies them into its own fields when it opens
   (KXPROF_APPLY with that game's field map) and shows them view-only. Nothing is applied when KORTEX has no profile. */
(function(){
 var P=null;try{P=JSON.parse(localStorage.getItem("KORTEX_PROFILE")||"null")}catch(e){}
 if(P&&typeof P!=="object")P=null;
 window.__KXP=P;
 function up(s){return String(s||"").toUpperCase()}
 function v(k){var p=window.__KXP;if(!p)return"";
  switch(k){
   case"schoolSid":return p.schoolShort&&p.sid?p.schoolShort+" ("+p.sid+")":(p.school||"");
   case"schoolShortU":return up(p.schoolShort||p.school);
   case"secFull":return[p.grade,p.section].filter(Boolean).join(" – ");
   case"teacherU":return up(p.teacher);
   case"headU":return up(p.head);
   case"teacherWithPos":return p.teacher?p.teacher+(p.teacherPos?", "+p.teacherPos:""):"";
   case"headWithPos":return p.head?p.head+(p.headPos?", "+p.headPos:""):"";
   default:return p[k]==null?"":String(p[k])}}
 window.KXPV=v;
 /* map: {source key: "field.path"}; only non-empty KORTEX values are copied */
 window.KXPROF_APPLY=function(o,map){if(!o||typeof o!=="object"||!window.__KXP)return 0;var n=0;
  for(var src in map){var val=v(src);if(!val)continue;var path=String(map[src]).split("."),t=o;
   for(var i=0;i<path.length-1;i++){if(t[path[i]]==null||typeof t[path[i]]!=="object")t[path[i]]={};t=t[path[i]]}
   var last=path[path.length-1];if(t[last]!==val){t[last]=val;n++}}
  return n};
})();
</script><script>/* KORTEX "until correct" (Venice, 13 Oct 2026): a question is not wasted.
   Teacher-led play: a wrong answer gets 0 for that learner (the first answer is the one that counts), then the same question
   passes to a classmate (or the next team) picked at random from those who have not tried it. A correct rescue earns that
   classmate the point (🛟 Rescue, also +1 in KORTEX Class Points). After 3 wrong answers the answer is shown and the class
   reads it together. Learner self-play: "Try again" until right; only the first answer is scored.
   ARENA and WHIZ CUP keep one answer per item. Rescue rows carry kxr:1 so KORTEX Analytics counts first answers only. */
(function(){
 var R={},MAX=3;
 function nk(s){return String(s==null?"":s).toUpperCase().replace(/[^A-Z0-9]+/g," ").trim()}
 window.KXR={
  max:MAX,
  get:function(k){return R[k]||null},
  isRescue:function(k){var r=R[k];return!!(r&&r.n>0&&!r.done)},
  pending:function(k){var r=R[k];return!!(r&&r.n>0&&!r.done)},
  wrong:function(k,who){var r=R[k]||(R[k]={n:0,tried:[],done:0});r.n++;if(who!=null&&r.tried.indexOf(who)<0)r.tried.push(who);if(r.n>=MAX)r.done=2;return r},
  right:function(k,who,award){var r=R[k];var was=!!(r&&r.n>0&&!r.done);if(r)r.done=1;if(was&&award!==false&&who!=null)KXR.award(who);return was},
  clear:function(k){delete R[k]},
  tried:function(k){var r=R[k];return r?r.tried.slice():[]},
  pickFrom:function(list,k){var t=KXR.tried(k),c=(list||[]).filter(function(x){return t.indexOf(x)<0});return c.length?c:(list||[])},
  /* +1 🛟 Rescue in KORTEX Class Points (the learner is found in the KORTEX masterlist by name) */
  award:function(name){try{var ro=JSON.parse(localStorage.getItem("KORTEX_ROSTER")||"[]")||[],n=nk(name),hit=null;
    ro.forEach(function(r){if(!hit&&r&&(nk(r.name)===n||nk(r.fn)===n||nk(r.id)===n))hit=r});if(!hit)return;
    var a=JSON.parse(localStorage.getItem("KORTEX_POINTS")||"[]")||[],d=new Date();
    a.push({id:hit.id,k:"s",v:1,ts:d.getTime(),d:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")});
    if(a.length>8000)a=a.slice(-8000);localStorage.setItem("KORTEX_POINTS",JSON.stringify(a))}catch(e){}},
  /* short Filipino-first lines with English in italics */
  T:{pass:'🛟 <b>Ipasa sa kaklase!</b> <i>Pass it to a classmate!</i>',passTeam:'🛟 <b>Ipasa sa susunod na pangkat!</b> <i>Pass it to the next team!</i>',
     read:'📖 <b>Basahin natin nang sabay ang tamang sagot.</b> <i>Let’s read the right answer together.</i>',again:'🔁 <b>Subukan muli!</b> <i>Try again!</i>',
     tap:'👉 <b>Basahin at pindutin ang tamang sagot.</b> <i>Read and tap the right answer.</i>',time:'⌛ <b>Ubos na ang oras!</b> <i>Time is up!</i>',
     together:'🤝 <b>Sabay-sabay nating sagutin.</b> <i>Let’s answer it together.</i>',
     rescued:'🛟 <b>Rescue! Sa kaklaseng sumagot nang tama ang puntos.</b> <i>The point goes to the classmate who answered right.</i>',
     rescuedTeam:'🛟 <b>Rescue! Sa pangkat na sumagot nang tama ang puntos.</b> <i>The point goes to the team that answered right.</i>',
     back:function(n){return'↩ <b>'+n+' kard ang ibinalik.</b> <i>'+n+' card'+(n==1?'':'s')+' went back. Sort '+(n==1?'it':'them')+' again.</i>'},
     turn:'🛟 Rescue Turn!'},
  say:function(t){try{if(!window.speechSynthesis||localStorage.getItem("KORTEX_MUTE")==="1")return;var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
 };
})();
