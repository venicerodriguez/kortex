akamaliit.\", \"Arrange 4, 9, and 2 from smallest.\"]], \"2|1|7\": [[\"Ang unang tunog ng sapatos ay /s/.\", \"The first sound of shoes is /s/.\"], [\"Ang huling tunog ng bulaklak ay /k/.\", \"The last sound of flower is /k/.\"], [\"Palitan ang /p/ sa pala ng /b/.\", \"Change /p/ in pala to /b/.\"], [\"Ang bata ay nagdidilig ng halaman.\", \"The child is watering the plants.\"], [\"Kumain muna siya bago pumasok.\", \"He ate first before going to school.\"]], \"2|1|8\": [[\"Ang langgam ay masipag at matulungin.\", \"The ant is hardworking and helpful.\"], [\"Una, nagising si Ben. Pagkatapos, naligo siya.\", \"First, Ben woke up. Then, he took a bath.\"], [\"Ano ang mangyayari kapag umulan?\", \"What will happen when it rains?\"], [\"Ibahagi ang paborito mong kuwento.\", \"Share your favorite story.\"], [\"Si Aling Nena ay nagtinda ng gulay.\", \"Aling Nena sold vegetables.\"]], \"3|1|7\": [[\"Gusto kong magtanong po.\", \"I want to ask a question, po.\"], [\"Umiiyak ang bata dahil nadapa siya.\", \"The child is crying because he fell.\"], [\"Una, maghugas ng kamay.\", \"First, wash your hands.\"], [\"Mabait ang lola ko.\", \"My grandmother is kind.\"], [\"Malapit sa palengke ang paaralan namin.\", \"Our school is near the market.\"]], \"3|1|8\": [[\"Pumunta kami sa parke at namasyal.\", \"We went to the park and took a walk.\"], [\"Gusto kong kumain ng prutas.\", \"I want to eat fruit.\"], [\"Bukas, magsisimba kami ng pamilya ko.\", \"Tomorrow, my family and I will go to church.\"], [\"Aray! Nasaktan ako!\", \"Ouch! I got hurt!\"], [\"Malumanay ang tinig ng guro.\", \"The teacher's voice is gentle.\"]], \"4|1|7\": [[\"Nagdarasal ako nang taimtim.\", \"I pray sincerely.\"], [\"Nakikiisa ako sa dasal ng klase.\", \"I join the class prayer.\"], [\"Pinagpapala ng dasal ang aking araw.\", \"Prayer blesses my day.\"], [\"Pinagsasalikop ko ang aking mga kamay sa dasal.\", \"I fold my hands in prayer.\"], [\"Nagdarasal ako para sa aking pamilya.\", \"I pray for my family.\"] ya.\", \"I am thankful for my family.\"]], \"3|2|4\": [[\"Mas matangkad si Kuya kaysa sa akin.\", \"Big brother is taller than me.\"], [\"Kumain kami ng adobo at kanin.\", \"We ate adobo and rice.\"], [\"Gusto kong tumulong sa bahay.\", \"I want to help at home.\"], [\"Humingi ako ng tulong sa nanay ko.\", \"I asked my mother for help.\"], [\"Sabay-sabay kaming nagdasal.\", \"We prayed together.\"]], \"4|2|3\": [[\"Nakikiisa ako sa paglilinis ng barangay.\", \"I join in cleaning the barangay.\"], [\"Ginagawa ko ang aking tungkulin.\", \"I do my duty.\"], [\"Tumutulong ako sa pagtatanim ng halaman.\", \"I help plant trees.\"], [\"Hindi ko iniiwan ang gawain ko.\", \"I do not leave my task.\"], [\"Responsable akong bata.\", \"I am a responsible child.\"]], \"4|2|4\": [[\"Sinusunod ko ang oras ng gawain.\", \"I follow the schedule of tasks.\"], [\"Tinatapos ko ang aking takdang-aralin.\", \"I finish my homework.\"], [\"Nag-aambag ako sa proyekto ng pamayanan.\", \"I contribute to the community project.\"], [\"Inaayos ko ang aking higaan.\", \"I make my bed.\"], [\"Handa akong tumulong sa kapitbahay.\", \"I am ready to help a neighbor.\"]], \"0|3|3\": [[\"Ang librarian ay nag-aalaga ng mga aklat.\", \"The librarian takes care of the books.\"], [\"Nagbabantay ang guwardiya sa tarangkahan.\", \"The guard watches the gate.\"], [\"May tindera sa kantina.\", \"The canteen has a vendor.\"], [\"Mahalaga ang bawat tao sa paaralan.\", \"Every person in school is important.\"], [\"Nagpapasalamat ako sa aming guro.\", \"I thank our teacher.\"]], \"0|3|4\": [[\"Ang tulay ay daan papunta sa paaralan.\", \"The bridge is the way to school.\"], [\"Ang ilaw trapiko ay para sa kaligtasan.\", \"The traffic light is for safety.\"], [\"Ang tawiran ay para sa mga naglalakad.\", \"The pedestrian lane is for walkers.\"], [\"Ang karatula ay nagbibigay ng babala.\", \"A sign gives a warning.\"], [\"Tumitingin ako sa dalawang direksyon bago tumawid.\", \"I look both ways before crossing.\"]], \"1|3|3\": [[\"Ang kalahati ay isa sa dalawang pantay na bahagi.\", \"A half is one of two equal parts.\"], [\"Ang isang-kapat ay isa sa apat na pantay na bahagi.\", \"A quarter is one of four equal parts.\"], [\"Hinati ko ang pizza sa dalawang bahagi.\", \"I divided the pizza into two parts.\"], [\"Mas malaki ang kalahati kaysa isang-kapat.\", \"A half is bigger than a quarter.\"], [\"Gumuhit ng bilog at kulayan ang kalahati.\", \"Draw a circle and color a half.\"]], \"1|3|4\": [[\"Ang dalawang kalahati ay isang buo.\", \"Two halves make one whole.\"], [\"Ang apat na isang-kapat ay isang buo.\", \"Four quarters make one whole.\"], [\"Bilangin ang mga kalahati sa larawan.\", \"Count the halves in the picture.\"], [\"Tatlong isang-kapat ang kulay asul.\", \"Three quarters are blue.\"], [\"Hatiin ang papel sa apat na bahagi.\", \"Fold the paper into four parts.\"]], \"2|3|3\": [[\"Ang hayop ay nasa kural.\", \"The animal is in the pen.\"], [\"Pumunta si Lito sa aklatan.\", \"Lito went to the library.\"], [\"Maputi ang mga ulap.\", \"The clouds are white.\"], [\"Natulog nang mahimbing ang sanggol.\", \"The baby slept soundly.\"], [\"Hinog at matamis ang prutas.\", \"The fruit is ripe and sweet.\"]], \"2|3|4\": [[\"Nagtatanim ng palay ang magsasaka.\", \"The farmer plants rice.\"], [\"Ano ang suliranin ng bata sa kuwento?\", \"What is the child's problem in the story?\"], [\"Nalutas ng bata ang suliranin.\", \"The child solved the problem.\"], [\"Bakit nabasa ang damit ni Rico?\", \"Why did Rico's clothes get wet?\"], [\"Matapang at mabait ang bayani.\", \"The hero is brave and kind.\"]], \"3|3|3\": [[\"Nagbebenta ng gulay ang tindero.\", \"The vendor sells vegetables.\"], [\"Sino ang nagbabantay sa paaralan?\", \"Who guards the school?\"], [\"Ang doktor ay gumagamot ng maysakit.\", \"The doctor treats the sick.\"], [\"Mag-ingat ka sa pagtawid!\", \"Be careful crossing!\"], [\"Kumusta po ang inyong araw?\", \"How is your day?\"]], \"3|3|4\": [[\"Tahimik ang pamayanan namin
